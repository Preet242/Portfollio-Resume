<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>404 — Page not found | Preet Patel</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#0a0a0c" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Archivo+Expanded:wght@600;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0a0a0c; --panel:#111114; --text:#f5f4f1; --muted:#9a9aa4;
      --line:#242429; --line2:#38383f; --accent:#ff3b30;
      --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
      --body:"Space Grotesk",-apple-system,"Segoe UI",Roboto,sans-serif;
      --display:"Archivo Expanded","Space Grotesk",sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:var(--body);min-height:100vh;
      display:flex;align-items:center;justify-content:center;padding:28px;overflow:hidden;position:relative}
    body::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
      background:radial-gradient(1200px 500px at 80% -10%, rgba(255,59,48,.16), transparent 60%),
                 radial-gradient(800px 400px at 0% 110%, rgba(255,59,48,.06), transparent 55%)}
    .wrap{position:relative;z-index:1;max-width:640px;text-align:left}
    .code{font-family:var(--display);font-weight:900;font-size:clamp(88px,22vw,190px);
      line-height:.9;letter-spacing:-.03em;color:transparent;-webkit-text-stroke:1.5px var(--line2)}
    .code .fill{color:var(--accent);-webkit-text-stroke:0}
    h1{font-family:var(--display);font-weight:800;font-size:clamp(22px,4vw,34px);
      text-transform:uppercase;letter-spacing:-.01em;margin-top:22px}
    p{color:var(--muted);font-size:17px;margin-top:14px;max-width:52ch}
    .ctas{margin-top:32px;display:flex;flex-wrap:wrap;gap:14px}
    .btn{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:13px;
      letter-spacing:.04em;text-transform:uppercase;padding:13px 20px;border-radius:2px;
      border:1px solid var(--line2);color:var(--text);text-decoration:none;transition:.18s}
    .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
    .btn.primary:hover{background:#e2352b}
    .btn.ghost:hover{border-color:var(--text)}
    .tag{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
      color:var(--muted);display:block;margin-bottom:6px}
  </style>
</head>
<body>
  <div class="wrap">
    <span class="tag">Error</span>
    <div class="code">4<span class="fill">0</span>4</div>
    <h1>This page took a wrong turn</h1>
    <p>The link is broken or the page moved. No dead ends here, let's get you back to the work. Redirecting you home in <span id="count">10</span> seconds.</p>
    <div class="ctas">
      <a class="btn primary" href="/">Back to home</a>
    </div>
  </div>
  <script>
    (function(){
      var n=10, el=document.getElementById('count');
      var t=setInterval(function(){
        n--; if(el) el.textContent=n;
        if(n<=0){ clearInterval(t); location.href="/"; }
      },1000);
    })();
  </script>
</body>
</html>
