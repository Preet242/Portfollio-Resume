<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Workout Guide</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B0B0F">
<meta name="description" content="A no-account, no-tracking reference guide for a 5-day bro split. Pick a day, swipe exercise variations, lift.">
<style>
/* ---------- Reset ---------- */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
html,body{height:100%;}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
body{
  overscroll-behavior-y:none;
  touch-action:pan-y;
}
img,svg{display:block;max-width:100%;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
a{color:inherit;}
ol,ul{list-style:none;}
input,button{-webkit-appearance:none;appearance:none;}

/* ---------- Design tokens ---------- */
:root{
  color-scheme:light;
  --bg:#F2F2F7;
  --bg-elevated:#FFFFFF;
  --card:#FFFFFF;
  --card-2:#F7F7FA;
  --text:#1C1C1E;
  --text-2:#6E6E73;
  --text-3:#9A9AA0;
  --border:rgba(60,60,67,0.13);
  --shadow:0 1px 2px rgba(0,0,0,0.04),0 8px 24px rgba(0,0,0,0.07);
  --shadow-lg:0 12px 40px rgba(0,0,0,0.16);
  --accent:#FF3B30;
  --accent-2:#0A84FF;
  --pill-bg:rgba(120,120,128,0.12);
  --overlay:rgba(0,0,0,0.35);
  --sheet-bg:#FFFFFF;
  --body-fill:#D4D4DA;
  --success:#30D158;
  --gutter:20px;
  --day-a:#0A84FF;
  --day-b:#5AC8FA;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
}
html.dark{
  color-scheme:dark;
  --bg:#000000;
  --bg-elevated:#111113;
  --card:#1C1C1E;
  --card-2:#242426;
  --text:#F5F5F7;
  --text-2:#98989D;
  --text-3:#6E6E73;
  --border:rgba(255,255,255,0.11);
  --shadow:0 1px 2px rgba(0,0,0,0.3),0 8px 28px rgba(0,0,0,0.5);
  --shadow-lg:0 16px 48px rgba(0,0,0,0.6);
  --pill-bg:rgba(120,120,128,0.24);
  --overlay:rgba(0,0,0,0.6);
  --sheet-bg:#1C1C1E;
  --body-fill:#3A3A3C;
}

body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  min-height:100%;
  transition:background .3s ease,color .3s ease;
  -webkit-font-smoothing:antialiased;
}

/* ---------- App shell ---------- */
#app{
  min-height:100vh;
  min-height:100dvh;
  padding-bottom:calc(env(safe-area-inset-bottom) + 24px);
  position:relative;
}

/* ---------- Desktop / wide-viewport presentation ----------
   Below ~680px this file behaves exactly like the mobile app.
   Above it, the app renders inside a floating "device" frame on
   an ambient wallpaper so it looks intentional on a laptop/desktop
   screen instead of a stretched-out phone layout. */
@media (min-width:680px){
  html,body{height:auto;min-height:100vh;}
  body{
    display:flex;justify-content:center;align-items:flex-start;
    padding:52px 24px;
    background:
      radial-gradient(760px circle at 12% 8%, rgba(255,69,58,.16), transparent 60%),
      radial-gradient(760px circle at 88% 12%, rgba(10,132,255,.16), transparent 60%),
      radial-gradient(820px circle at 50% 100%, rgba(168,85,247,.14), transparent 60%),
      var(--bg);
  }
  html.dark body{
    background:
      radial-gradient(760px circle at 12% 8%, rgba(255,69,58,.14), transparent 60%),
      radial-gradient(760px circle at 88% 12%, rgba(10,132,255,.16), transparent 60%),
      radial-gradient(820px circle at 50% 100%, rgba(168,85,247,.16), transparent 60%),
      var(--bg);
  }
  #app{
    width:430px;flex:none;
    height:min(920px, calc(100vh - 104px));
    min-height:0;
    margin:0;border-radius:44px;
    overflow-x:hidden;overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    box-shadow:var(--shadow-lg);
    border:1px solid var(--border);
    transform:translateZ(0); /* containing block for the fixed-position sheet */
  }
}
.view{display:none;}
.view.active{display:block;animation:fadeIn .28s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* ---------- Topbar ---------- */
#topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid transparent;
}
#topbar.scrolled{border-bottom-color:var(--border);}
.topbar-btn{
  display:flex;align-items:center;gap:4px;
  min-height:44px;padding:0 10px;border-radius:14px;
  font-size:17px;font-weight:590;color:var(--accent-2);
}
.topbar-btn:active{opacity:.5;}
.topbar-btn svg{width:12px;height:20px;fill:var(--accent-2);}
.topbar-title{font-size:17px;font-weight:650;letter-spacing:-.2px;}
.icon-btn{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--pill-bg);
  font-size:18px;
}
.icon-btn:active{transform:scale(.9);}

/* ---------- Home ---------- */
.home-header{padding:18px var(--gutter) 6px;}
.home-header h1{font-size:34px;font-weight:750;letter-spacing:-.6px;}
.home-header p{color:var(--text-2);font-size:15px;margin-top:4px;font-weight:450;}
.day-grid{
  padding:16px var(--gutter) 8px;
  display:grid;grid-template-columns:1fr;gap:14px;
}
.day-card{
  position:relative;overflow:hidden;
  border-radius:26px;padding:24px 22px;
  min-height:140px;
  display:flex;flex-direction:column;justify-content:space-between;
  color:#fff;
  box-shadow:0 1px 1px rgba(0,0,0,.05), 0 14px 30px -8px rgba(0,0,0,.28);
  transform:translateZ(0);
  transition:transform .15s ease, box-shadow .15s ease;
}
.day-card:active{transform:scale(.97);}
.day-card .top{position:relative;z-index:2;display:flex;align-items:flex-start;justify-content:space-between;}
.day-card h2{font-size:25px;font-weight:750;letter-spacing:-.4px;text-shadow:0 1px 6px rgba(0,0,0,.15);}
.day-card .meta{font-size:13px;opacity:.92;font-weight:560;margin-top:3px;max-width:75%;line-height:1.4;}
.day-card .badge{
  position:relative;flex:none;
  width:52px;height:52px;border-radius:16px;
  background:rgba(255,255,255,.22);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.5), inset 0 -1px 2px rgba(0,0,0,.08);
  display:flex;align-items:center;justify-content:center;
}
.day-card .badge svg{width:27px;height:27px;fill:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.18));}
.day-card .chev{position:relative;z-index:2;display:flex;align-items:center;gap:4px;font-size:14px;font-weight:650;opacity:.97;align-self:flex-start;}
.day-card .sheen{
  position:absolute;inset:0;z-index:1;
  background:radial-gradient(130% 100% at 12% -15%, rgba(255,255,255,.4), transparent 55%);
  pointer-events:none;
}
.day-card .watermark{
  position:absolute;right:-22px;bottom:-26px;z-index:0;
  width:130px;height:130px;opacity:.16;
  transform:rotate(-10deg);
  pointer-events:none;
}
.day-card .watermark svg{width:100%;height:100%;fill:#fff;}
.day-card.chest{background:linear-gradient(135deg,#FF6B5E 0%,#FF3B30 55%,#E0263B 100%);}
.day-card.back{background:linear-gradient(135deg,#3DDC97 0%,#1DB876 55%,#0E8F6A 100%);}
.day-card.legs{background:linear-gradient(135deg,#5AA7FF 0%,#3B7CFF 55%,#3B5FE0 100%);}
.day-card.shoulders{background:linear-gradient(135deg,#C084FC 0%,#A855F7 55%,#8B33E8 100%);}
.day-card.arms{background:linear-gradient(135deg,#FFB84D 0%,#FF9500 55%,#E67E00 100%);}
@media (hover:hover) and (pointer:fine){
  .day-card{cursor:pointer;}
  .day-card:hover{transform:translateY(-2px);box-shadow:0 1px 1px rgba(0,0,0,.05), 0 20px 38px -10px rgba(0,0,0,.34);}
}

.home-footnote{padding:18px var(--gutter) 8px;color:var(--text-3);font-size:12.5px;line-height:1.5;text-align:center;}

/* ---------- Day view ---------- */
.day-hero{padding:6px var(--gutter) 4px;}
.day-hero h1{font-size:30px;font-weight:750;letter-spacing:-.5px;}
.day-hero p{color:var(--text-2);font-size:14.5px;margin-top:3px;}

.slot{padding:18px var(--gutter) 4px;}
.slot-head{display:flex;align-items:baseline;gap:8px;padding:0 0 10px;}
.slot-num{
  width:24px;height:24px;border-radius:8px;
  background:color-mix(in srgb, var(--day-a) 15%, transparent);
  display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:700;color:var(--day-a);flex:none;
}
.slot-head h3{font-size:19px;font-weight:680;letter-spacing:-.3px;}
.slot-head .swipe-hint{margin-left:auto;font-size:11.5px;color:var(--text-3);font-weight:560;display:flex;align-items:center;gap:3px;}

.carousel-wrap{position:relative;}
.carousel{
  display:flex;gap:12px;overflow-x:auto;
  scroll-snap-type:x mandatory;
  padding:4px 0 8px;
  scrollbar-width:none;
  -ms-overflow-style:none;
}
.carousel::-webkit-scrollbar{display:none;}
.carousel .spacer{flex:none;width:1px;}
.ex-card{
  flex:0 0 84%;
  scroll-snap-align:center;
  background:var(--card);
  border-radius:20px;
  box-shadow:var(--shadow);
  display:flex;flex-direction:column;
  min-height:150px;
  overflow:hidden;
  transition:transform .12s ease;
}
.ex-card:active{transform:scale(.98);}
.ex-photo{width:100%;height:120px;flex:none;background:var(--card-2);overflow:hidden;}
.ex-photo img{width:100%;height:100%;object-fit:cover;display:block;}
.ex-card-body{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1;}
.ex-card .row1{display:flex;align-items:center;gap:12px;}
.ex-thumb{
  width:56px;height:56px;border-radius:16px;flex:none;
  background:color-mix(in srgb, var(--day-a) 15%, var(--card-2));
  display:flex;align-items:center;justify-content:center;
}
.ex-thumb svg{width:30px;height:30px;fill:var(--day-a);}
.ex-card .name-wrap{min-width:0;flex:1;}
.ex-card h4{font-size:17px;font-weight:650;letter-spacing:-.2px;line-height:1.2;}
.ex-card .equip{font-size:12.5px;color:var(--text-2);font-weight:560;margin-top:2px;}
.ex-card .stats{
  display:flex;gap:8px;flex-wrap:wrap;
}
.pill{
  background:var(--pill-bg);
  padding:5px 10px;border-radius:10px;
  font-size:12.5px;font-weight:620;color:var(--text-2);
}
.ex-card .tap-row{
  margin-top:auto;display:flex;align-items:center;justify-content:space-between;
  padding-top:6px;border-top:1px solid var(--border);
}
.ex-card .tap-row span{font-size:13px;color:var(--day-a);font-weight:600;}
.ex-card .tap-row svg{width:8px;height:14px;fill:var(--day-a);}

.dots{display:flex;gap:6px;justify-content:center;padding:10px 0 2px;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--text-3);opacity:.4;transition:all .2s ease;}
.dot.active{opacity:1;background:var(--day-a);width:16px;border-radius:3px;}

/* Desktop-only prev/next affordance for mouse users (touch devices keep swipe-only) */
.car-nav{
  display:none;
  position:absolute;top:50%;transform:translateY(-50%);
  width:34px;height:34px;border-radius:50%;
  background:var(--card);color:var(--day-a);
  align-items:center;justify-content:center;
  box-shadow:var(--shadow-lg);
  opacity:0;transition:opacity .15s ease;
  z-index:3;
}
.car-nav svg{width:9px;height:15px;fill:currentColor;}
.car-nav.prev{left:-4px;}
.car-nav.next{right:-4px;}
@media (hover:hover) and (pointer:fine){
  .car-nav{display:flex;}
  .carousel-wrap:hover .car-nav{opacity:1;}
}

/* ---------- Recap ---------- */
.recap{margin:22px var(--gutter) 0;background:var(--card);border-radius:20px;padding:18px 18px 6px;box-shadow:var(--shadow);}
.recap h3{font-size:17px;font-weight:680;margin-bottom:10px;}
.recap ol{counter-reset:step;}
.recap li{
  counter-increment:step;
  display:flex;align-items:center;gap:10px;
  padding:11px 2px;border-bottom:1px solid var(--border);
  font-size:15px;font-weight:520;
}
.recap li:last-child{border-bottom:none;}
.recap li::before{
  content:counter(step);
  width:22px;height:22px;border-radius:50%;
  background:color-mix(in srgb, var(--day-a) 15%, transparent);color:var(--day-a);
  font-size:11.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex:none;
}
.recap .note{color:var(--text-3);font-size:12px;padding:10px 2px 14px;line-height:1.5;}

/* ---------- Sheet (bottom sheet modal) ---------- */
#sheet-overlay{
  position:fixed;inset:0;z-index:50;
  background:var(--overlay);
  opacity:0;pointer-events:none;
  transition:opacity .25s ease;
}
#sheet-overlay.open{opacity:1;pointer-events:auto;}
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;
  max-height:92vh;max-height:92dvh;
  background:var(--sheet-bg);
  border-radius:26px 26px 0 0;
  box-shadow:var(--shadow-lg);
  transform:translateY(100%);
  transition:transform .32s cubic-bezier(.32,.72,0,1);
  display:flex;flex-direction:column;
  overflow:hidden;
  overscroll-behavior:contain;
}
#sheet.open{transform:translateY(0);}
#sheet.dragging{transition:none;}
.sheet-handle-area{
  flex:none;position:relative;height:52px;
  display:flex;align-items:center;justify-content:center;
  touch-action:none;
}
.sheet-handle{width:36px;height:5px;border-radius:3px;background:var(--text-3);opacity:.45;}
.sheet-close{
  position:absolute;top:50%;right:12px;transform:translateY(-50%);z-index:10;
  width:36px;height:36px;border-radius:50%;
  background:var(--pill-bg);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;color:var(--text-2);font-weight:700;
}
.sheet-close:active{background:color-mix(in srgb, var(--text-2) 25%, var(--pill-bg));}
.sheet-scroll{
  flex:1 1 auto;min-height:0;
  overflow-y:auto;padding:6px 22px calc(env(safe-area-inset-bottom) + 28px);
  -webkit-overflow-scrolling:touch;
}
.sheet-photo{
  position:relative;
  width:calc(100% + 44px);margin:-6px -22px 14px;
  height:200px;background:var(--card-2);overflow:hidden;
}
.sheet-photo img{width:100%;height:100%;object-fit:cover;display:block;}
.sheet-photo-badge{
  position:absolute;right:14px;bottom:-22px;
  width:60px;height:60px;border-radius:16px;
  background:var(--sheet-bg);box-shadow:var(--shadow-lg);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.sheet-photo-badge svg.body{width:32px;height:56px;fill:var(--body-fill);}
.sheet-visual{
  display:flex;align-items:center;gap:16px;
  padding:8px 4px 18px;
}
.body-diagram{
  position:relative;flex:none;width:96px;height:150px;
  background:var(--card-2);border-radius:18px;
  display:flex;align-items:center;justify-content:center;
}
.body-diagram svg.body{width:60px;height:110px;fill:var(--body-fill);}
.muscle-glow{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle, color-mix(in srgb, var(--day-a) 85%, transparent) 0%, transparent 72%);
  animation:pulse 1.8s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.55;}50%{opacity:1;}}
.sheet-title-block{flex:1;min-width:0;}
.sheet-title-block h2{font-size:23px;font-weight:750;letter-spacing:-.4px;line-height:1.15;}
.sheet-equip-row{display:flex;align-items:center;gap:6px;margin-top:6px;color:var(--text-2);font-size:13.5px;font-weight:560;}
.sheet-equip-row svg{width:18px;height:18px;fill:var(--text-2);}
.sheet-stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}

.yt-link{
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin:4px 0 20px;padding:14px;border-radius:16px;
  background:linear-gradient(135deg,var(--day-b),var(--day-a));
  color:#fff;font-size:15.5px;font-weight:650;
  min-height:48px;
  box-shadow:0 8px 20px -6px color-mix(in srgb, var(--day-a) 60%, transparent);
}
.yt-link:active{opacity:.85;}
.yt-link svg{width:20px;height:20px;fill:#fff;}

.sheet-section{margin-bottom:24px;}
.sheet-section h3{
  font-size:13px;font-weight:700;letter-spacing:.3px;
  color:var(--text-3);text-transform:uppercase;margin-bottom:10px;
}
.effort-card{
  background:var(--card-2);border-radius:16px;padding:14px 16px;
  display:flex;justify-content:space-between;gap:12px;
}
.effort-card .item{flex:1;}
.effort-card .item .label{font-size:11.5px;color:var(--text-3);font-weight:650;text-transform:uppercase;letter-spacing:.2px;}
.effort-card .item .val{font-size:15.5px;font-weight:650;margin-top:3px;}
.steps-list{display:flex;flex-direction:column;gap:12px;}
.step-item{display:flex;gap:12px;align-items:flex-start;}
.step-num{
  width:26px;height:26px;border-radius:50%;flex:none;
  background:var(--day-a);color:#fff;font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.step-item p{font-size:15px;line-height:1.45;font-weight:460;padding-top:2px;}

.mistakes-list{display:flex;flex-direction:column;gap:12px;}
.mistake-item{
  background:var(--card-2);border-radius:16px;padding:13px 15px;
  border-left:3px solid var(--day-a);
}
.mistake-item .m{font-size:14.5px;font-weight:650;line-height:1.35;}
.mistake-item .f{font-size:14px;color:var(--text-2);margin-top:5px;line-height:1.4;font-weight:460;}
.mistake-item .f b{color:var(--success);font-weight:650;}

/* ---------- Utility ---------- */
.hidden{display:none !important;}
@media (max-width:340px){
  .home-header h1{font-size:29px;}
  .day-card h2{font-size:21px;}
  .ex-card{flex-basis:88%;}
}
</style>
</head>
<body>

<div id="app">

  <!-- HOME VIEW -->
  <main id="view-home" class="view active">
    <div class="home-header">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div>
          <h1>Workout Guide</h1>
          <p>Pick today's split. Swipe for variations.</p>
        </div>
        <button class="icon-btn" id="darkToggleHome" aria-label="Toggle dark mode">🌙</button>
      </div>
    </div>
    <div class="day-grid" id="dayGrid"></div>
    <p class="home-footnote">No accounts. No tracking. Nothing saved — just open, pick a day, and go lift.</p>
  </main>

  <!-- DAY VIEW -->
  <main id="view-day" class="view">
    <div id="topbar">
      <button class="topbar-btn" id="backBtn">
        <svg viewBox="0 0 12 20"><path d="M11 1L2 10l9 9"/></svg>
        Home
      </button>
      <span class="topbar-title" id="topbarTitle"></span>
      <button class="icon-btn" id="darkToggleDay" aria-label="Toggle dark mode">🌙</button>
    </div>
    <div class="day-hero">
      <h1 id="dayTitle"></h1>
      <p id="daySub"></p>
    </div>
    <div id="slotsWrap"></div>
    <div class="recap" id="recapWrap"></div>
  </main>

  <!-- DETAIL SHEET (nested in #app so it's contained by the desktop device frame) -->
  <div id="sheet-overlay">
    <div id="sheet" role="dialog" aria-modal="true">
      <div class="sheet-handle-area" id="sheetHandleArea">
        <div class="sheet-handle"></div>
        <button class="sheet-close" id="sheetCloseBtn" aria-label="Close">✕</button>
      </div>
      <div class="sheet-scroll" id="sheetContent"></div>
    </div>
  </div>

</div>

<script>
(function(){
"use strict";

/* =========================================================
   ICONS
   ========================================================= */
const ICONS = {
  chevronRight: '<svg viewBox="0 0 8 14"><path d="M1 1l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  chevronLeft: '<svg viewBox="0 0 8 14"><path d="M7 1L1 7l6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',

const viewHome = document.getElementById("view-home");
const viewDay = document.getElementById("view-day");
const dayTitle = document.getElementById("dayTitle");
const daySub = document.getElementById("daySub");
const topbarTitle = document.getElementById("topbarTitle");
const slotsWrap = document.getElementById("slotsWrap");
const recapWrap = document.getElementById("recapWrap");

let currentDay = null;

const appEl = document.getElementById("app");
function resetScroll(){
  window.scrollTo(0,0);
  appEl.scrollTop = 0;
}

function goHome(){
  currentDay = null;
  viewDay.classList.remove("active");
  viewHome.classList.add("active");
  resetScroll();
}

function openDay(key){
  currentDay = key;
  applyTheme(key);
  const d = DB[key];
  dayTitle.textContent = d.label + " Day";
  daySub.textContent = d.sub;
  topbarTitle.textContent = d.label;

  slotsWrap.innerHTML = d.slots.map((slot, si)=>{
    const cards = slot.options.map((ex, oi)=>{
      const photo = EXERCISE_IMG[ex.name];
      return `
      <div class="ex-card" data-slot="${si}" data-opt="${oi}" tabindex="0">
        ${photo ? `<div class="ex-photo"><img src="${photo}" loading="lazy" decoding="async" alt="" onerror="this.closest('.ex-photo').remove()"></div>` : ""}
        <div class="ex-card-body">
          <div class="row1">
            <div class="ex-thumb">${ICONS.equip[ex.equip]}</div>
            <div class="name-wrap">
              <h4>${ex.name}</h4>
              <div class="equip">${EQUIP_LABEL[ex.equip]}</div>
            </div>
          </div>
          <div class="stats">
            <span class="pill">${ex.sets}</span>
          </div>
          <div class="tap-row"><span>Tap for details</span>${ICONS.chevronRight}</div>
        </div>
      </div>`;
    }).join("") + `<div class="spacer"></div>`;

    const dots = slot.options.length > 1
      ? `<div class="dots" data-dots="${si}">${slot.options.map((_,i)=>`<div class="dot${i===0?' active':''}"></div>`).join("")}</div>`
      : "";

    const navArrows = slot.options.length > 1
      ? `<button class="car-nav prev" data-nav="prev" data-carousel="${si}" aria-label="Previous">${ICONS.chevronLeft}</button>
         <button class="car-nav next" data-nav="next" data-carousel="${si}" aria-label="Next">${ICONS.chevronRight}</button>`
      : "";

    return `<div class="slot">
      <div class="slot-head">
        <span class="slot-num">${si+1}</span>
        <h3>${slot.name}</h3>
        ${slot.options.length>1 ? `<span class="swipe-hint">swipe ↔</span>` : ""}
      </div>
      <div class="carousel-wrap">
        <div class="carousel" data-carousel="${si}">${cards}</div>
        ${navArrows}
      </div>
      ${dots}
    </div>`;
  }).join("");

  recapWrap.innerHTML = `<h3>Today's Order</h3>
    <ol>${d.slots.map(s=>`<li>${s.name}</li>`).join("")}</ol>
    <p class="note">Pick any variation via swipe for each slot above — the order stays compound-to-isolation either way.</p>`;

  viewHome.classList.remove("active");
  viewDay.classList.add("active");
  resetScroll();
  attachCarouselListeners();
}

function attachCarouselListeners(){
  document.querySelectorAll(".carousel").forEach(car=>{
    const si = car.getAttribute("data-carousel");
    const dotsWrap = document.querySelector(`[data-dots="${si}"]`);
    if(!dotsWrap) return;
    let ticking = false;
    car.addEventListener("scroll", ()=>{
      if(ticking) return;
      ticking = true;
      requestAnimationFrame(()=>{
        const cards = car.querySelectorAll(".ex-card");
        if(cards.length){
          const cardW = cards[0].getBoundingClientRect().width + 12;
          const idx = Math.round(car.scrollLeft / cardW);
          dotsWrap.querySelectorAll(".dot").forEach((dot,i)=>{
            dot.classList.toggle("active", i===Math.min(idx, cards.length-1));
          });
        }
        ticking = false;
      });
    }, {passive:true});
  });

  /* Desktop hover arrows — no-op on touch devices since they're hidden there */
  document.querySelectorAll(".car-nav").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const car = document.querySelector(`.carousel[data-carousel="${btn.getAttribute("data-carousel")}"]`);
      const card = car.querySelector(".ex-card");
      if(!car || !card) return;
      const step = card.getBoundingClientRect().width + 12;
      car.scrollBy({left: btn.getAttribute("data-nav")==="next" ? step : -step, behavior:"smooth"});
    });
  });
}

}

/* Swipe-down-to-dismiss on the sheet handle area (real touch events) */
(function(){
  let startY = 0, currentY = 0, dragging = false;
  sheetHandleArea.addEventListener("touchstart", (e)=>{
    startY = e.touches[0].clientY;
    dragging = true;
    sheet.classList.add("dragging");
  }, {passive:true});
  sheetHandleArea.addEventListener("touchmove", (e)=>{
    if(!dragging) return;
    currentY = e.touches[0].clientY - startY;
    if(currentY < 0) currentY = 0;
    sheet.style.transform = `translateY(${currentY}px)`;
  }, {passive:true});
  sheetHandleArea.addEventListener("touchend", ()=>{
    dragging = false;
    sheet.classList.remove("dragging");
    sheet.style.transform = "";
    if(currentY > 110){
      closeSheet();
    }
    currentY = 0;
  });
})();

sheetOverlay.addEventListener("click", (e)=>{
  if(e.target === sheetOverlay) closeSheet();
});
document.getElementById("sheetCloseBtn").addEventListener("click", closeSheet);

  document.getElementById("darkToggleHome").textContent = isDark ? "☀️" : "🌙";
  document.getElementById("darkToggleDay").textContent = isDark ? "☀️" : "🌙";
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", isDark ? "#000000" : "#F2F2F7");
}
document.getElementById("darkToggleHome").addEventListener("click", toggleDark);
document.getElementById("darkToggleDay").addEventListener("click", toggleDark);

/* Respect system preference on load, session-only */
if(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches){
  toggleDark();
}

/* Topbar shadow on scroll — bound to both the window (mobile) and #app
   (the desktop frame scrolls internally, not the window). */
function updateTopbarShadow(){
  const y = window.scrollY || appEl.scrollTop || 0;
  document.getElementById("topbar").classList.toggle("scrolled", y > 4);
}
window.addEventListener("scroll", updateTopbarShadow, {passive:true});
appEl.addEventListener("scroll", updateTopbarShadow, {passive:true});

/* Prevent double-tap-to-zoom while keeping normal taps snappy */
let lastTouchEnd = 0;
document.addEventListener("touchend", (e)=>{
  const now = Date.now();
  if(now - lastTouchEnd <= 300){
    e.preventDefault();
  }
  lastTouchEnd = now;
}, {passive:false});

/* Prevent pinch-zoom gesture */
document.addEventListener("gesturestart", (e)=> e.preventDefault());

/* =========================================================
   INIT
   ========================================================= */
renderHome();

})();
</script>
</body>
</html>
